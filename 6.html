<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
</head>

<body>
    <p id="text"></p>
    <button>Criar nova aventura</button>

    <script>
        const text = document.querySelector('#text')
        const btn = document.querySelector('button')

        let acoes = ['A Busca', 'A Batalha', 'O Resgate']
        let locais = [' na Floresta Sombria', ' no Reino Perdido', ' na Montanha Misteriosa']
        let complementos = [' o Dragão', ' do Tesouro Esquecido', ' da Espada Ancestral']

        btn.addEventListener('click', () => {
            let i = Math.floor(Math.random() * acoes.length)
            let acao = acoes[i]

            i = Math.floor(Math.random() * locais.length)
            let local = locais[i]

            i = Math.floor(Math.random() * complementos.length)
            let complemento = complementos[i]

            text.textContent = acao + local + complemento
        })
    </script>
</body>

</html>
